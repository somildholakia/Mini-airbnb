name: Keep WanderSite warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app and check its health endpoint
        env:
          SITE_URL: https://practice-project-p5ge.onrender.com
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-connrefused --retry-delay 8 \
            --max-time 90 \
            "${SITE_URL%/}/health"
