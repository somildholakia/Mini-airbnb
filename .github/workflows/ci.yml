name: WanderSite checks

on:
  push:
    branches:
      - main
      - feat/wandersite-reliability-map
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and refresh compatible dependency versions
        run: npm install
      - name: Apply remaining compatible security updates
        run: npm audit fix || true
      - name: Commit regenerated lockfile when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh patched package lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
      - name: Verify clean lockfile install
        run: npm ci
      - run: npm test
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require("./npm-audit.json");
          const metadata = report.metadata?.vulnerabilities || {};
          console.log("Dependency audit totals:", JSON.stringify(metadata));
          for (const [name, finding] of Object.entries(report.vulnerabilities || {})) {
            const via = (finding.via || []).map((item) =>
              typeof item === "string" ? item : item.title + " (" + item.range + ")"
            );
            console.log(JSON.stringify({
              package: name,
              severity: finding.severity,
              direct: finding.isDirect,
              installedRange: finding.range,
              fixAvailable: finding.fixAvailable,
              advisories: via
            }));
          }
          NODE
      - name: Block high or critical dependency advisories
        run: npm audit --audit-level=high
